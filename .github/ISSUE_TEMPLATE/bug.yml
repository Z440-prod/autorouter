name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: environment
    attributes:
      label: AutoRouter version, host version, and OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Use synthetic data and redact private content.
    validations:
      required: true
