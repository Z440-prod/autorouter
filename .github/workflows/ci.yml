name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: autorouter hosts
      - run: python -m unittest discover -s tests -p test_universal.py
      - if: runner.os == 'Linux'
        run: python -m unittest discover -s tests
      - run: python -m unittest discover -s examples/ledger
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --location --silent --show-error "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar xf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact=100 --no-banner --log-opts=--all
